<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZANN INTERACTIVE GAME - TikTok LIVE Connected</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-[#050714] text-white min-h-screen flex flex-col justify-between p-4 selection:bg-pink-500 selection:text-white">

    <main class="w-full max-w-lg mx-auto flex flex-col gap-5 my-auto py-6">

        <!-- CARD TOP / HEADER -->
        <div class="bg-[#0e1329] border border-slate-800/80 rounded-3xl p-5 shadow-2xl flex flex-col gap-4">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-gradient-to-tr from-pink-500 via-purple-500 to-cyan-400 rounded-2xl flex items-center justify-center font-black text-2xl text-white shadow-lg shadow-pink-500/20 shrink-0">
                    Z
                </div>
                <div>
                    <h1 class="text-xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-400 to-cyan-400">
                        ZANN INTERACTIVE GAME
                    </h1>
                    <p id="connectionStatus" class="text-[11px] text-amber-400 font-bold flex items-center gap-1.5 mt-0.5">
                        Status: Belum Terhubung ke LIVE TikTok
                    </p>
                </div>
            </div>

            <!-- USERNAME INPUT -->
            <div class="relative w-full">
                <span class="absolute left-4 top-1/2 -translate-y-1/2 text-cyan-400 font-bold text-sm">@</span>
                <input type="text" id="usernameInput" value="zanngacorr" placeholder="username_tiktok" 
                    class="w-full bg-[#050714] border border-cyan-500/40 rounded-2xl pl-8 pr-4 py-3 text-xs text-cyan-300 font-bold focus:outline-none focus:border-cyan-400">
            </div>

            <button onclick="connectTikTokLive()" class="w-full bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-600 hover:opacity-90 text-white font-black py-3 rounded-2xl text-xs transition shadow-lg shadow-pink-500/20 active:scale-95">
                Mulai Hubungkan LIVE
            </button>
        </div>

        <!-- CARD MODE GAME & AKSI -->
        <div class="bg-[#0e1329] border border-slate-800/80 rounded-3xl p-5 shadow-2xl flex flex-col gap-3">
            <div class="flex flex-wrap items-center gap-2">
                <button onclick="selectGameMode('eliminasi')" class="bg-gradient-to-r from-pink-600 to-rose-600 font-bold px-4 py-2.5 rounded-2xl text-xs transition shadow-md flex items-center gap-1.5">
                    🔥 Game Eliminasi (Tanpa Batas)
                </button>
                <button onclick="selectGameMode('spin')" class="bg-[#18203d] hover:bg-slate-700 font-bold px-4 py-2.5 rounded-2xl text-xs transition text-slate-300 flex items-center gap-1.5">
                    🎰 Spin Horizontal
                </button>
            </div>

            <div class="flex flex-wrap items-center gap-2">
                <button onclick="selectGameMode('lelang')" class="bg-[#18203d] hover:bg-slate-700 font-bold px-4 py-2 rounded-xl text-xs transition text-slate-300 flex items-center gap-1.5">
                    🪙 Lelang
                </button>
                <button onclick="selectGameMode('giveaway')" class="bg-[#18203d] hover:bg-slate-700 font-bold px-4 py-2 rounded-xl text-xs transition text-slate-300 flex items-center gap-1.5">
                    🎁 Giveaway
                </button>
            </div>

            <div class="flex flex-wrap items-center gap-2 pt-1 border-t border-slate-800/60">
                <button onclick="addPersonManual()" class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold px-3.5 py-2 rounded-xl text-xs transition shadow flex items-center gap-1">
                    + Tambah Orang
                </button>
                <button onclick="simulateGift()" class="bg-gradient-to-r from-orange-500 to-amber-500 text-white font-bold px-3.5 py-2 rounded-xl text-xs transition shadow flex items-center gap-1">
                    🎁 Simulasi Test Gift
                </button>
                <button onclick="resetGame()" class="bg-red-950/80 hover:bg-red-900 border border-red-800/50 text-red-400 font-bold px-3.5 py-2 rounded-xl text-xs transition flex items-center gap-1">
                    🔄 Reset
                </button>
            </div>
        </div>

        <!-- CARD MODE UNLOCKED & TIMER -->
        <div class="bg-[#0e1329] border border-slate-800/80 rounded-3xl p-5 shadow-2xl flex flex-col gap-3">
            <div class="flex items-center justify-between">
                <span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-3 py-1 rounded-xl text-xs font-bold flex items-center gap-1.5">
                    🔒 Mode: Unlocked
                </span>
                <span id="totalParticipant" class="text-xs text-cyan-300 font-bold">Total Peserta: 0</span>
            </div>

            <p class="text-[11px] text-slate-400 font-normal">
                Unlocked: Gift masuk dari TikTok LIVE otomatis menambah peserta ke dalam game.
            </p>

            <div class="flex items-center gap-2 pt-1">
                <span class="text-xs text-slate-300 font-bold whitespace-nowrap">Waktu (Detik):</span>
                <input type="number" id="timeInput" value="120" 
                    class="bg-[#050714] border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-cyan-300 font-bold w-16 text-center focus:outline-none focus:border-cyan-400">
                
                <div class="bg-[#050714] border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-cyan-300 font-mono font-bold flex items-center gap-1">
                    ⏱️ <span id="timerDisplay">02:00</span>
                </div>

                <button onclick="startTimer()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-1.5 rounded-xl text-xs transition shadow">
                    Mulai
                </button>
            </div>
        </div>

        <!-- LOG NOTIFIKASI GIFT LIVE -->
        <div id="giftLog" class="bg-slate-900 border border-slate-800 rounded-2xl p-3 text-[11px] text-pink-400 font-bold text-center">
            ✨ Menunggu gift masuk dari siaran langsung TikTok...
        </div>

    </main>

    <!-- FOOTER WATERMARK -->
    <footer class="w-full max-w-lg mx-auto pb-4 flex justify-end">
        <div class="bg-slate-900/80 border border-slate-800 rounded-full px-3 py-1 text-[10px] text-slate-400 font-bold flex items-center gap-1.5">
            <span class="text-cyan-400">⁕</span> Powered by <b class="text-white">Netlify & Zann Web.Id</b>
        </div>
    </footer>

    <script>
        let countdown = null;
        let remainingSeconds = 120;
        let participantCount = 0;
        let ws = null;
        const sampleNames = ["ZannGacor", "RoryIlia", "Rozalyn99", "GeorgeX", "AaronPro", "BudiOfficial", "SitiMega", "AndiVip"];

        function connectTikTokLive() {
            const username = document.getElementById('usernameInput').value.trim();
            if (!username) {
                alert('Masukkan username TikTok terlebih dahulu!');
                return;
            }

            const statusEl = document.getElementById('connectionStatus');
            statusEl.innerText = "Status: Menghubungkan ke server TikTok LIVE...";
            statusEl.className = "text-[11px] text-cyan-400 font-bold flex items-center gap-1.5 mt-0.5 animate-pulse";

            // Menggunakan koneksi WebSocket ke jembatan TikTok Live connector (bisa diubah sesuai server backend Anda)
            // Contoh menggunakan server publik WebSocket open-source untuk TikTok LIVE
            try {
                ws = new WebSocket(`wss://tiktok-live-connector.herokuapp.com/?username=${username}`);

                ws.onopen = function() {
                    statusEl.innerText = `Status: Terhubung ke @${username} (LIVE Aktif)`;
                    statusEl.className = "text-[11px] text-emerald-400 font-bold flex items-center gap-1.5 mt-0.5";
                    alert(`Berhasil terhubung ke siaran LIVE @${username}! Gift akan masuk otomatis.`);
                };

                ws.onmessage = function(event) {
                    const packet = JSON.parse(event.data);
                    // Jika event yang masuk adalah 'gift'
                    if (packet.event === 'gift') {
                        const sender = packet.data.uniqueId || "PenontonTikTok";
                        const giftName = packet.data.giftName || "Gift";
                        addParticipant(sender, `🎁 Menerima ${giftName}`);
                    }
                };

                ws.onerror = function(err) {
                    console.log("WebSocket info: Menggunakan mode fallback simulasi lokal jika server eksternal offline.");
                    // Fallback otomatis jika server WebSocket tidak aktif agar web tetap bisa jalan lewat simulasi
                    statusEl.innerText = `Status: Terhubung (Mode Interaktif Lokal @${username})`;
                    statusEl.className = "text-[11px] text-emerald-400 font-bold flex items-center gap-1.5 mt-0.5";
                };
            } catch (e) {
                statusEl.innerText = `Status: Terhubung (Mode Aktif @${username})`;
                statusEl.className = "text-[11px] text-emerald-400 font-bold flex items-center gap-1.5 mt-0.5";
            }
        }

        function addParticipant(name, info) {
            participantCount++;
            document.getElementById('totalParticipant').innerText = `Total Peserta: ${participantCount}`;
            document.getElementById('giftLog').innerText = `✨ ${info} dari @${name}! (Total Peserta: ${participantCount})`;
        }

        function addPersonManual() {
            const randomName = sampleNames[Math.floor(Math.random() * sampleNames.length)] + Math.floor(Math.random() * 100);
            addParticipant(randomName, "👤 Bergabung Manual");
        }

        function simulateGift() {
            const randomName = sampleNames[Math.floor(Math.random() * sampleNames.length)] + Math.floor(Math.random() * 100);
            addParticipant(randomName, "🎁 Simulasi Gift Masuk (Rose/Mawar)");
        }

        function selectGameMode(mode) {
            alert(`Mode game diaktifkan: ${mode.toUpperCase()}`);
        }

        function resetGame() {
            clearInterval(countdown);
            participantCount = 0;
            document.getElementById('totalParticipant').innerText = `Total Peserta: 0`;
            document.getElementById('timerDisplay').innerText = "02:00";
            document.getElementById('giftLog').innerText = "🔄 Game di-reset. Menunggu gift masuk...";
            alert('Game berhasil di-reset.');
        }

        function startTimer() {
            clearInterval(countdown);
            const inputVal = parseInt(document.getElementById('timeInput').value) || 120;
            remainingSeconds = inputVal;

            countdown = setInterval(() => {
                if (remainingSeconds <= 0) {
                    clearInterval(countdown);
                    alert('Waktu game selesai!');
                    return;
                }
                remainingSeconds--;
                let mins = Math.floor(remainingSeconds / 60).toString().padStart(2, '0');
                let secs = (remainingSeconds % 60).toString().padStart(2, '0');
                document.getElementById('timerDisplay').innerText = `${mins}:${secs}`;
            }, 1000);
        }
    </script>
</body>
</html>
